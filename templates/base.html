<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Школьная электронная библиотека{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
                    <span class="brand-mark">📚</span>
                    <span>Школьная электронная библиотека</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('catalog') }}">Каталог</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('requests_page') }}">Мои заявки</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                <span>Школьная электронная библиотека</span>
                <span class="text-white-50">Каталог книг, бронирование и учёт заявок</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.__BOOKS__ = {{ books|tojson if books is defined else '[]'|safe }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
